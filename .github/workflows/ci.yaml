name: CI Platform API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r api/requirements.txt

      - name: Executar testes
        run: python -m pytest -q
        working-directory: api

      - name: Construir imagem
        run: docker build -t platform-api:${{ github.sha }} ./api
