name: CI Platform API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r api/requirements.txt

      - name: Executar testes
        run: python -m pytest -q
        working-directory: api

      - name: Construir imagem
        run: docker build -t ghcr.io/lvbeserra/platform-api:${{ github.sha }} ./api

      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Publicar imagem
        if: github.event_name != 'pull_request'
        run: docker push ghcr.io/lvbeserra/platform-api:${{ github.sha }}
