apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-api-gitops
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/lvbeserra/sre-lab.git
    targetRevision: main
    path: chart

  destination:
    server: https://kubernetes.default.svc
    namespace: lab

  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
